summary: >-
  **Développeur Full Stack** proactif avec **+2 ans d'expérience** dans le
  développement d'applications web innovantes pour divers projets publics tels
  que [Wifina](https://wifina.be/), [IBC](https://app.ibc.preprod.cysc.fr/),
  [oDoc](https://odoc.ma/), [AppartAli](https://appartali.com/),
  [AVSM Club](https://avsm.ma/), [Invoicr SaaS](https://www.invoicrapp.com/)
  and [Allo Clients](https://www.allo-clients.com/). Pionnier des processus de
  développement de bout en bout, améliorant les performances des applications et
  l'engagement des utilisateurs grâce à une collaboration interfonctionnelle
  efficace. Recherche des opportunités pour tirer parti de son expertise en
  développement full stack afin de fournir des solutions de pointe et de
  favoriser l'avancement technologique.

